name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run unit and integration tests (network isolated)
        run: npm test

      - name: Run package smoke tests (installed artifact verification)
        run: npm run test:package

  dry-run:
    name: Release Dry-Run Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository (with git history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.19.0
        uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Run Release Dry-Run
        run: npm run release:check
